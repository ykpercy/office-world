<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<title>打工人世界 · 开放世界上班模拟</title>
<style>
:root{--bg:#1c2230;--panel:rgba(20,24,36,.9);--tx:#f2f4f8;--mut:#9aa4b8;--ac:#ffb84d;--ok:#5fd68a;--bad:#ff6b6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141d}}
:root[data-theme="dark"]{--bg:#10141d}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none}
#top{position:fixed;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));pointer-events:none;z-index:2}
.hud{display:flex;gap:8px;flex-wrap:wrap}
.box{background:var(--panel);border-radius:10px;padding:6px 10px;font-size:13px}
.bar{width:90px;height:7px;background:#ffffff22;border-radius:4px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;width:0;transition:width .2s}
#hint{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);padding:8px 14px;border-radius:20px;font-size:14px;display:none;white-space:nowrap}
#log{position:fixed;left:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));width:min(340px,60vw);max-height:130px;overflow:hidden;font-size:12px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;pointer-events:none}
#log div{background:var(--panel);padding:3px 8px;border-radius:6px;width:fit-content;max-width:100%}
#chat{position:fixed;left:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));width:min(340px,70vw);display:none;padding:8px;border-radius:8px;border:1px solid var(--ac);background:var(--panel);color:var(--tx);font-size:16px}
#over{position:fixed;inset:0;background:rgba(8,10,16,.82);display:flex;align-items:center;justify-content:center;z-index:5;padding:16px}
#card{background:#222a3c;color:#f2f4f8;border-radius:16px;padding:24px;max-width:420px;width:100%;line-height:1.7;font-size:14px}
#card h1{margin:0 0 6px;font-size:24px}
#card input{width:100%;padding:9px;border-radius:8px;border:1px solid #556;background:#151a26;color:#fff;font-size:16px;margin:8px 0}
#card button{width:100%;padding:11px;border:0;border-radius:8px;background:var(--ac);color:#222;font-weight:700;font-size:16px;cursor:pointer}
.mut{color:var(--mut);font-size:12px}
#mp{font-size:12px}
#mu{pointer-events:auto;cursor:pointer;user-select:none}
html,body{touch-action:none;-webkit-user-select:none;user-select:none}
#touch{display:none}
@media (pointer:coarse){
 #touch{display:block}
 #joy{position:fixed;left:calc(22px + env(safe-area-inset-left,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35);touch-action:none;z-index:3}
 #knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,184,77,.85);pointer-events:none}
 .tb{position:fixed;right:calc(22px + env(safe-area-inset-right,0px));width:68px;height:68px;border-radius:50%;background:rgba(20,24,36,.78);border:2px solid rgba(255,255,255,.4);color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;touch-action:none;z-index:3}
 #bE{bottom:calc(48px + env(safe-area-inset-bottom,0px));background:rgba(255,184,77,.9);color:#222;width:84px;height:84px;font-size:22px}
 #bR{bottom:calc(144px + env(safe-area-inset-bottom,0px));right:calc(118px + env(safe-area-inset-right,0px));width:56px;height:56px;font-size:13px}
 #bR.on{background:#5fd68a;color:#222}
 #bC{bottom:calc(144px + env(safe-area-inset-bottom,0px));width:56px;height:56px;font-size:20px}
 #hint{bottom:calc(190px + env(safe-area-inset-bottom,0px))}
 #log{position:static;margin-top:8px;width:min(300px,70vw)}
 #chat{bottom:auto;top:calc(60px + env(safe-area-inset-top,0px));width:calc(100vw - 16px);z-index:6}
}
</style>
</head>
<body>
<canvas id="c3"></canvas>
<canvas id="c"></canvas>
<div id="top"><div class="hud">
  <div class="box" id="clock">Day 1 · 08:30</div>
  <div class="box">精力<div class="bar"><i id="b-en" style="background:var(--ok)"></i></div></div>
  <div class="box">压力<div class="bar"><i id="b-st" style="background:var(--bad)"></i></div></div>
  <div class="box">项目<div class="bar"><i id="b-pr" style="background:var(--ac)"></i></div></div>
  <div class="box" id="money">¥0</div>
  <div class="box" id="task">目标：9:00 前到办公区打卡</div>
  <div class="box" id="mu" title="背景音乐（M）">🔊</div>
</div>
<div class="box" id="mp" style="margin-top:8px;width:fit-content">单人模式</div>
<div id="log"></div>
</div>
<div id="hint"></div>
<input id="chat" maxlength="60" placeholder="输入消息，回车发送，Esc 取消">
<div id="touch">
  <div id="joy"><div id="knob"></div></div>
  <div class="tb" id="bE">E</div>
  <div class="tb" id="bR">快走</div>
  <div class="tb" id="bC">💬</div>
</div>
<div id="over"><div id="card">
  <h1>🏢 打工人世界</h1>
  <div class="mut">开放世界 · 多人在线 · 上班模拟器</div>
  <p>准时打卡、在工位搬砖完成项目、开会点头、茶水间续命，别被老板抓到摸鱼。下班发薪水！</p>
  <p class="mut">WASD / 方向键移动（Shift 快走）· E 交互（工位按住）· 回车聊天<br>手机：左下摇杆移动，右侧按钮 E 交互（工位按住）/ 快走 / 聊天<br>打开同一页面的其他同事会实时出现在世界里。</p>
  <input id="nm" maxlength="8" placeholder="你的名字">
  <div id="auth" style="display:none">
    <input id="pw" type="password" maxlength="64" placeholder="密码（6 位以上）" autocomplete="current-password">
    <div style="display:flex;gap:8px"><button id="bl">登录</button><button id="br" style="background:#5fd68a">注册</button></div>
    <div id="amsg" class="mut" style="min-height:20px;margin:6px 0"></div>
  </div>
  <button id="go">开始上班</button>
  <div id="lo" class="mut" style="display:none;cursor:pointer;text-decoration:underline;margin-top:10px;text-align:center">退出登录 / 换账号</div>
</div></div>
<script>
(function(){
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const W=2400,H=1500;
const COARSE=matchMedia('(pointer:coarse)').matches;   // 触屏设备：降低分辨率上限和帧率，省电降温
const _el={};const E_=id=>_el[id]||(_el[id]=document.getElementById(id));
function setT(id,v){const e=E_(id);if(e._t!==v){e._t=v;e.textContent=v}}          // 只在内容变化时才写 DOM
function setW(id,v){const e=E_(id);v=Math.round(v)+'%';if(e._w!==v){e._w=v;e.style.width=v}}
function setD(id,v){const e=E_(id);if(e._d!==v){e._d=v;e.style.display=v}}
var R3=null,cam3=null;   // 3D 渲染器与相机；为 null 时使用 2D 画面
let vw=0,vh=0,dpr=1;
function rs(){dpr=Math.min(window.devicePixelRatio||1,COARSE?1.5:2);vw=innerWidth;vh=innerHeight;cv.width=vw*dpr;cv.height=vh*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(R3)resize3()}
addEventListener('resize',rs);rs();

// ---- 世界 ----
const zones=[
 {id:'office',n:'开放办公区',x:150,y:150,w:1300,h:760,c:'#d9dde6',k:'zone'},
 {id:'meet',n:'会议室',x:1550,y:150,w:700,h:420,c:'#cfd8e8',k:'zone'},
 {id:'pantry',n:'茶水间',x:1550,y:660,w:700,h:250,c:'#e6dcc8',k:'zone'},
 {id:'boss',n:'老板办公室',x:150,y:1010,w:520,h:340,c:'#d8cfc0',k:'zone'},
 {id:'cafe',n:'楼下咖啡店',x:800,y:1060,w:460,h:300,c:'#e9d3bd',k:'zone'},
 {id:'park',n:'街心公园',x:1450,y:1010,w:800,h:400,c:'#9fd18f',k:'zone'},
];
const desks=[];
for(let r=0;r<3;r++)for(let c=0;c<5;c++)desks.push({x:260+c*240,y:260+r*220,w:130,h:70});
const Z=id=>zones.find(z=>z.id===id);
const inZ=(z,x,y)=>x>z.x&&x<z.x+z.w&&y>z.y&&y<z.y+z.h;
const spots=[ // 交互点
 {id:'printer',n:'打印机',x:1380,y:260,t:'print'},
 {id:'coffee',n:'咖啡机',x:1650,y:760,t:'coffee'},
 {id:'cafe',n:'咖啡柜台',x:1030,y:1120,t:'cafe'},
 {id:'bench',n:'长椅',x:1800,y:1200,t:'bench'},
 {id:'boss',n:'老板的桌子',x:400,y:1120,t:'report'},
];

// ---- 状态 ----
const me={x:1000,y:960,vx:0,vy:0,name:'打工人'+(Math.floor(Math.random()*900)+100),col:'hsl('+Math.floor(Math.random()*360)+',70%,58%)',dir:1,act:'走',bub:'',bubT:0};
const g={day:1,t:8*60+30,en:100,st:10,pr:0,money:0,done:0,late:false,paidLate:false,attend:0,fines:0,earned:0,run:false,over:false,dayStats:null};
const keys={},joy={x:0,y:0};
let nearSpot=null,workHold=0,msgT=0;
const peers=new Map(); // peer -> {x,y,name,col,bub,bubT,tx,ty,act}
const boss={x:300,y:1150,tx:300,ty:1150,w:0,state:'idle'};
let room=null;

function fmt(t){return String(Math.floor(t/60)%24).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0')}
function say(s,col){const d=document.createElement('div');d.textContent=s;if(col)d.style.color=col;const l=$('log');l.appendChild(d);while(l.children.length>6)l.removeChild(l.firstChild);setTimeout(()=>d.remove(),9000)}
function toast(s,col){msgT=3;setT('task',s);$('task').style.color=col||''}
function inMeeting(){const h=g.t/60;return (h>=10&&h<11)||(h>=15&&h<16)}
function curTask(){
 const h=g.t/60;
 if(h<9&&!g.late)return '目标：9:00 前到办公区打卡';
 if(inMeeting())return '📅 开会了！去会议室（按 E 在场内点头）';
 if(g.pr>=100)return '项目完成！';
 if(g.en<25)return '精力不足，去茶水间或咖啡店续命';
 if(g.st>80)return '压力爆表，去公园长椅坐坐';
 if(h>=17.5)return '快下班了，冲刺项目！';
 return '去工位按住 E 搬砖，推进项目';
}

// ---- 输入 ----
addEventListener('keydown',e=>{
 if(document.activeElement===$('chat')){
  if(e.key==='Enter'){const v=$('chat').value.trim();if(v)sendChat(v);$('chat').value='';$('chat').style.display='none';$('chat').blur()}
  else if(e.key==='Escape'){$('chat').style.display='none';$('chat').blur()}
  return}
 if(!g.run)return;
 const k=e.key.toLowerCase();keys[k]=true;
 if(e.key==='Enter'){$('chat').style.display='block';$('chat').focus();e.preventDefault()}
 if(k==='e')interact(true);
 if(k==='m')Music.toggle();
 if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});

function sendChat(t){
 me.bub=t;me.bubT=5;say(me.name+'：'+t);
 if(room)room.emit('chat',{n:me.name,t}).catch(()=>{});
}

// ---- 交互 ----
function atDesk(){return desks.find(d=>Math.abs(me.x-(d.x+d.w/2))<90&&me.y>d.y+d.h&&me.y<d.y+d.h+90)}
function interact(press){
 if(g.over)return;
 const h=g.t/60;
 if(inMeeting()&&inZ(Z('meet'),me.x,me.y)){
  if(press){g.attend++;me.bub='嗯嗯，有道理';me.bubT=2;g.earned+=5;g.money+=5;toast('点头 +¥5，会议出勤 +1','var(--ok)');g.st=Math.max(0,g.st-1)}
  return}
 if(atDesk()){ // 工位搬砖由持续按键处理
  return}
 if(!nearSpot||!press)return;
 const s=nearSpot;
 if(s.t==='coffee'){if(g.en>=100)return toast('精力已满');g.en=Math.min(100,g.en+25);g.st=Math.max(0,g.st-2);toast('茶水间咖啡 +25 精力','var(--ok)')}
 if(s.t==='cafe'){if(g.money<15)return toast('钱不够了…','var(--bad)');g.money-=15;g.en=Math.min(100,g.en+45);g.st=Math.max(0,g.st-5);toast('买了杯拿铁 −¥15，精力 +45','var(--ok)')}
 if(s.t==='bench'){g.st=Math.max(0,g.st-15);g.en=Math.min(100,g.en+5);toast('晒太阳发呆 压力 −15','var(--ok)');if(h>=9&&h<18&&!inMeeting()){g.pr=Math.max(0,g.pr-0);}}
 if(s.t==='print'){if(g.pr<30)return toast('没什么好打印的');g.pr=Math.min(100,g.pr+8);toast('打印材料，项目 +8','var(--ok)')}
 if(s.t==='report'){
  if(g.pr>=100){g.pr=0;g.done++;g.money+=200;g.earned+=200;g.st=Math.max(0,g.st-10);toast('提交项目 🎉 奖金 +¥200','var(--ok)');say('老板：干得不错，继续保持！','var(--ac)')}
  else{g.st=Math.min(100,g.st+8);toast('项目没做完就来汇报？压力 +8','var(--bad)');say('老板：怎么才这点进度？','var(--bad)')}
 }
}

// ---- 老板巡视 ----
function bossTick(dt){
 const h=g.t/60,work=h>=9&&h<18;
 boss.w-=dt;
 if(!work){boss.tx=400;boss.ty=1150}
 else if(boss.w<=0){
  boss.w=6+Math.random()*8;
  if(Math.random()<.55){const d=desks[Math.floor(Math.random()*desks.length)];boss.tx=d.x+60;boss.ty=d.y+130;boss.state='patrol'}
  else{boss.tx=400;boss.ty=1150;boss.state='idle'}
 }
 const dx=boss.tx-boss.x,dy=boss.ty-boss.y,d=Math.hypot(dx,dy);
 if(d>4){boss.x+=dx/d*70*dt;boss.y+=dy/d*70*dt}
}

// ---- 主逻辑 ----
let last=0,working=false,workAcc=0,sendAcc=0,lastSent='';
function update(dt){
 if(g.over)return;
 // 时间：1 秒 ≈ 1.6 游戏分钟
 g.t+=dt*1.6;
 const h=g.t/60;
 if(h>=9&&!g.paidLate&&h<18){g.paidLate=true;if(!inZ(Z('office'),me.x,me.y)&&!inMeeting()){g.late=true;g.money-=50;g.fines+=50;toast('迟到！罚款 −¥50','var(--bad)');say('HR：你今天迟到了。','var(--bad)')}else{g.money+=30;g.earned+=30;toast('准时打卡 +¥30','var(--ok)')}}
 if(h>=18){endDay();return}
 // 移动
 let ix=(keys['d']||keys['arrowright']?1:0)-(keys['a']||keys['arrowleft']?1:0);
 let iy=(keys['s']||keys['arrowdown']?1:0)-(keys['w']||keys['arrowup']?1:0);
 if(joy.x||joy.y){ix=joy.x;iy=joy.y}
 const m=Math.hypot(ix,iy);if(m>1){ix/=m;iy/=m}
 const run=keys['shift']&&g.en>10;
 const sp=(run?300:190)*(g.en<20?.65:1);
 working=false;
 if(keys['e']&&atDesk()&&h>=9){working=true}
 if(working){ix=0;iy=0}
 me.x=Math.max(20,Math.min(W-20,me.x+ix*sp*dt));
 me.y=Math.max(20,Math.min(H-20,me.y+iy*sp*dt));
 // 桌子碰撞（简单推出）
 for(const d of desks){if(me.x>d.x-12&&me.x<d.x+d.w+12&&me.y>d.y-8&&me.y<d.y+d.h){const cx=me.x-(d.x+d.w/2),cy=me.y-(d.y+d.h/2);
  if(Math.abs(cx/(d.w/2+12))>Math.abs(cy/(d.h/2+8)))me.x=cx>0?d.x+d.w+12:d.x-12;else me.y=cy>0?d.y+d.h:d.y-8}}
 if(ix>0)me.dir=1;else if(ix<0)me.dir=-1;
 me.moving=m>0;
 if(run&&m>0)g.en-=dt*0.5;
 // 搬砖
 if(working){
  workAcc+=dt;g.en-=dt*1.6;g.st+=dt*.35;
  g.pr=Math.min(100,g.pr+dt*(g.en>25?2.6:1.2));
  me.act='工作中';
  if(g.pr>=100&&!g.notified){g.notified=true;toast('项目完成！去老板办公室提交','var(--ok)')}
 }else{me.act=m>0?'走':'站';g.st-=dt*.05}
 if(g.pr<100)g.notified=false;
 if(inMeeting()&&!inZ(Z('meet'),me.x,me.y)){g.st+=dt*.15}
 // 精力、压力
 if(h>=9)g.en-=dt*.12;
 g.en=Math.max(0,Math.min(100,g.en));g.st=Math.max(0,Math.min(100,g.st));
 if(g.en<=0){g.st+=dt*.8}
 // 老板抓摸鱼
 const near=Math.hypot(boss.x-me.x,boss.y-me.y)<170;
 if(near&&h>=9&&h<18&&!working&&!inMeeting()&&inZ(Z('office'),me.x,me.y)){
  g.bossT=(g.bossT||0)+dt;
  if(g.bossT>2.5){g.bossT=0;g.st=Math.min(100,g.st+6);g.money-=20;g.fines+=20;toast('被老板抓到摸鱼！罚款 −¥20','var(--bad)');say('老板：你站这儿干嘛？','var(--bad)')}
 }else g.bossT=0;
 if(g.st>=100&&!g.burn){g.burn=true;g.money-=40;g.fines+=40;toast('压力爆表，请假一小时 −¥40','var(--bad)');g.st=60;g.en=Math.max(g.en,40)}
 if(g.st<90)g.burn=false;
 // 最近交互点
 nearSpot=null;for(const s of spots){if(Math.hypot(s.x-me.x,s.y-me.y)<75){nearSpot=s;break}}
 bossTick(dt);
 if(me.bubT>0)me.bubT-=dt;
 for(const p of peers.values()){p.x+=(p.tx-p.x)*Math.min(1,dt*10);p.y+=(p.ty-p.y)*Math.min(1,dt*10);if(p.bubT>0)p.bubT-=dt}
 // 联机同步
 sendAcc+=dt;
 if(room&&sendAcc>.1){
  sendAcc=0;
  const o={x:Math.round(me.x),y:Math.round(me.y),n:me.name,c:me.col,a:me.act,d:me.dir};
  const s=JSON.stringify(o);
  if(s!==lastSent){lastSent=s;room.presence(o).catch(()=>{})}
 }
 if(msgT>0){msgT-=dt;if(msgT<=0){$('task').style.color='';setT('task',curTask())}}
 else setT('task',curTask());
}

function endDay(){
 g.over=true;
 const base=300,total=base+g.earned-g.fines;
 g.money+=base;saveNow();
 const o=$('over');o.style.display='flex';
 $('card').innerHTML='<h1>🌇 下班啦！第 '+g.day+' 天</h1><p>基本工资 ¥'+base+'<br>绩效/奖金 +¥'+g.earned+'<br>罚款 −¥'+g.fines+'<br>完成项目：'+g.done+' 个 · 会议出勤：'+g.attend+' 次<br><b>今日实发：¥'+total+'</b>（账户余额 ¥'+Math.round(g.money)+'）</p><button id="nx">明天继续上班</button>';
 $('nx').onclick=()=>{g.day++;g.t=8*60+30;g.en=Math.min(100,g.en+60);g.st=Math.max(0,g.st-30);g.pr=0;g.earned=0;g.fines=0;g.attend=0;g.paidLate=false;g.late=false;g.over=false;g.burn=false;me.x=1000;me.y=960;o.style.display='none';saveNow()};
}

// ---- 绘制 ----
function drawPerson(x,y,col,name,act,dir,bub,isMe,mv){
 const t=performance.now()/120,bob=mv?Math.sin(t)*2.5:0;

   else if(m.t==='p'){peers.set(m.id,m.d);notify()}

(function(){
 const jb=$('joy'),kn=$('knob'),R=45;let pid=null,cx=0,cy=0;
 function upd(e){
  const dx=e.clientX-cx,dy=e.clientY-cy,d=Math.hypot(dx,dy)||1,k=Math.min(1,d/R);
  let x=dx/d*k,y=dy/d*k;if(k<.18){x=0;y=0}
  joy.x=x;joy.y=y;kn.style.transform='translate('+x*R+'px,'+y*R+'px)';
 }
 function end(){pid=null;joy.x=0;joy.y=0;kn.style.transform=''}
 jb.addEventListener('pointerdown',e=>{if(pid!==null)return;pid=e.pointerId;jb.setPointerCapture(pid);const r=jb.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;upd(e);e.preventDefault()});
 jb.addEventListener('pointermove',e=>{if(e.pointerId===pid)upd(e)});
 ['pointerup','pointercancel','lostpointercapture'].forEach(t=>jb.addEventListener(t,e=>{if(e.pointerId===pid)end()}));
 const bE=$('bE');
 bE.addEventListener('pointerdown',e=>{e.preventDefault();bE.setPointerCapture(e.pointerId);keys['e']=true;if(g.run)interact(true)});
 ['pointerup','pointercancel'].forEach(t=>bE.addEventListener(t,()=>{keys['e']=false}));
 $('bR').addEventListener('pointerdown',e=>{e.preventDefault();keys['shift']=!keys['shift'];$('bR').classList.toggle('on',!!keys['shift'])});
 $('bC').addEventListener('pointerdown',e=>{e.preventDefault();if(!g.run)return;$('chat').style.display='block';$('chat').focus()});
 document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
})();
$('nm').value=me.name;
// ---- 背景音乐：预渲染的 8-bit 循环（MP3，由 tools/render-music.html 生成），运行时只解码并在循环区间内重复播放，几乎不占 CPU ----
const Music=(()=>{
 let ac=null,gain=null,src=null,buf=null,on=true,playing=false;
 try{on=localStorage.getItem('ow_music')!=='0'}catch(e){}
 function label(){const m=$('mu');if(m)m.textContent=on?'🔊':'🔇'}
 function start(){
  if(!buf||src||!playing)return;
  src=ac.createBufferSource();src.buffer=buf;src.loop=true;src.loopStart=MUSIC_LOOP[0];src.loopEnd=MUSIC_LOOP[1];src.connect(gain);src.start();
 }
 function unlock(){
  if(!ac){
   const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
   ac=new C();gain=ac.createGain();gain.gain.value=on?1:0;gain.connect(ac.destination);
   const bin=atob(MUSIC_B64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
   ac.decodeAudioData(u.buffer,b=>{buf=b;start()},()=>{});
  }
  if(on&&ac.state!=='running')ac.resume();
 }
 function play(){unlock();playing=true;start()}
 function toggle(){
  on=!on;try{localStorage.setItem('ow_music',on?'1':'0')}catch(e){}
  label();if(!ac)unlock();
  if(!ac)return;
  gain.gain.setTargetAtTime(on?1:0,ac.currentTime,.08);
  if(on)ac.resume();else setTimeout(()=>{if(!on)ac.suspend()},500); // 静音时彻底暂停音频线程
 }
 document.addEventListener('visibilitychange',()=>{if(!ac)return;if(document.hidden)ac.suspend();else if(on)ac.resume()});
 label();
 const mu=$('mu');if(mu)mu.addEventListener('pointerdown',e=>{e.preventDefault();toggle()});
 return{unlock,play,toggle};
})();

// ---- 账号与存档 ----
const API=(()=>{const u=serverUrl();return u?u.replace(/^ws/,'http').replace(/\/+$/,''):''})();
let auth={token:null,name:null};
async function api(p,o){o=o||{};const h={'Content-Type':'application/json'};if(auth.token)h.Authorization='Bearer '+auth.token;
 const r=await fetch(API+p,{method:o.method||'GET',headers:h,body:o.body,keepalive:!!o.keep});
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('请求失败 '+r.status));return j}
function applySave(sv){sv=sv||{};g.day=sv.day||1;g.money=sv.money||0;g.done=sv.done||0;g.en=sv.en==null?100:sv.en;g.st=sv.st==null?10:sv.st;if(sv.col)me.col=sv.col}
function saveNow(keep){if(!auth.token)return;api('/api/save',{method:'PUT',keep:keep,body:JSON.stringify({day:g.day,money:Math.round(g.money),done:g.done,en:Math.round(g.en),st:Math.round(g.st),col:me.col})}).catch(()=>{})}
function startGame(){
 if(auth.token)me.name=auth.name;
 else{const v=$('nm').value.trim();if(v)me.name=API?('游客'+v).slice(0,8):v.slice(0,8)}
 $('over').style.display='none';g.run=true;resetZoom();Music.play();setT('task',curTask());connect();
}
async function doAuth(kind){
 Music.unlock();
 const name=$('nm').value.trim(),password=$('pw').value;$('amsg').textContent='请稍候…';
 try{const j=await api('/api/'+kind,{method:'POST',body:JSON.stringify({name,password})});
  auth={token:j.token,name:j.name};try{localStorage.setItem('ow_token',j.token)}catch(e){}
  applySave(j.save);startGame()}
 catch(e){$('amsg').textContent=e.message}
}
$('go').onclick=()=>{Music.unlock();startGame()};
$('bl').onclick=()=>doAuth('login');$('br').onclick=()=>doAuth('register');
$('lo').onclick=()=>{try{localStorage.removeItem('ow_token')}catch(e){}location.reload()};
setInterval(()=>{if(g.run&&!g.over)saveNow()},15000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow(true)});
addEventListener('pagehide',()=>saveNow(true));
(async()=>{
 if(!API)return;
 $('go').disabled=true;$('go').textContent='连接服务器中…（首次可能需要几十秒）';
 let ok=false;
 try{
  const st=await api('/api/status');if(!st.accounts)return;ok=true;
  $('auth').style.display='block';$('go').textContent='游客试玩（不保存）';
  let t=null;try{t=localStorage.getItem('ow_token')}catch(e){}
  if(t){auth.token=t;
   try{const j=await api('/api/save');auth.name=j.name;applySave(j.save);$('nm').value=j.name;$('nm').disabled=true;
    $('auth').style.display='none';$('go').textContent='继续游戏（'+j.name+'）';$('lo').style.display='block'}
   catch(e){auth.token=null;try{localStorage.removeItem('ow_token')}catch(_){}}}
 }catch(e){}
 finally{$('go').disabled=false;if(!ok)$('go').textContent='开始上班'}
})();
