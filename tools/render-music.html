<!DOCTYPE html>
<meta charset="utf-8"><title>音乐离线渲染</title>
<!-- 用法：python tools/build_music.py（需要 pip install playwright && playwright install chromium）
     修改下面的合成代码（速度、旋律、音色等）后重新运行，会自动生成循环 WAV 并写回 index.html -->
<pre id="o">用 build_music.py 调用 Music.renderLoop()</pre>
<script>
const SR=22050;let LIMIT=0;
const Music=(()=>{
 let ac=null,bus,master,timer=null,next=0,step=0,on=true,noise=null,sq,sq2,dbus,bassBus;
 const E=60/118/2,N=m=>440*Math.pow(2,(m-69)/12);
 // 8 小节循环：C G Am F C G F G；旋律为 [音高, 持续步数]（1 步 = 八分音符）
 const roots=[48,43,45,41,48,43,41,43];
 const tri=[[60,64,67],[59,62,67],[57,60,64],[57,60,65],[60,64,67],[59,62,67],[57,60,65],[59,62,67]];
 const mel=[
  [[76,1],[79,1],[84,2],[79,1],[76,1],[79,1],[0,1]],
  [[83,1],[79,1],[74,2],[79,1],[83,1],[86,1],[0,1]],
  [[81,1],[76,1],[72,2],[76,1],[81,1],[84,1],[0,1]],
  [[77,1],[81,1],[84,3],[0,3]],
  [[84,1],[83,1],[84,1],[79,1],[76,2],[79,1],[0,1]],
  [[79,1],[83,1],[86,2],[83,1],[79,1],[74,1],[0,1]],
  [[77,1],[81,1],[84,1],[81,1],[89,2],[84,1],[0,1]],
  [[83,1],[79,1],[74,2],[0,4]]
 ].map(bar=>{const m={};let p=0;bar.forEach(([n,l])=>{m[p]=[n,l];p+=l});return m});
 const bassOff=[0,null,null,12,7,null,12,null],lvl=[.85,.9,.95,.8,.9,.95,1,.7];
 function pulse(d){const n=24,re=new Float32Array(n+1),im=new Float32Array(n+1);for(let k=1;k<=n;k++)re[k]=2/(k*Math.PI)*Math.sin(k*Math.PI*d);return ac.createPeriodicWave(re,im)}
 function unlock(){
  if(!ac){
   ac=new OfflineAudioContext(1,Math.ceil((3*64*E+1.5)*SR),SR);master=ac.createGain();master.gain.value=on?0.38:0;master.connect(ac.destination);
   bus=ac.createGain();const sf=ac.createBiquadFilter();sf.type='lowpass';sf.frequency.value=4500;bus.connect(sf);sf.connect(master);dbus=ac.createGain();dbus.connect(master);bassBus=ac.createGain();bassBus.connect(bus); // 鼓组走独立干声通道，不进回声；贝斯单独成组，便于避让底鼓
   const d=ac.createDelay(1);d.delayTime.value=E*1.5;const fb=ac.createGain();fb.gain.value=.25;
   const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2500;const wet=ac.createGain();wet.gain.value=.22;
   bus.connect(d);d.connect(lp);lp.connect(fb);fb.connect(d);lp.connect(wet);wet.connect(master);
   const b=ac.createBuffer(1,ac.sampleRate*.3,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;noise=b;
   sq=pulse(.25);sq2=pulse(.125);
  }
 }
 function tone(w,f,t,dur,vol){
  const o=ac.createOscillator(),g=ac.createGain();
  if(typeof w==='string')o.type=w;else o.setPeriodicWave(w);
  o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.01);
  g.gain.exponentialRampToValueAtTime(vol*.55,t+dur*.7);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(bus);o.start(t);o.stop(t+dur+.03);
 }
 function bass(f,t,dur,vol){ // 圆润低音：正弦基音 + 轻微泛音，低通滤波，柔和起音
  const g=ac.createGain(),fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.value=650;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.012);
  g.gain.exponentialRampToValueAtTime(vol*.5,t+dur*.5);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  [[1,1],[2,.32],[3,.1]].forEach(([k,a])=>{const o=ac.createOscillator(),h=ac.createGain();o.type='sine';o.frequency.value=f*k;h.gain.value=a;o.connect(h);h.connect(g);o.start(t);o.stop(t+dur+.03)});
  g.connect(fl);fl.connect(bassBus);
 }
 function kick(t,v){ // 短促的底鼓，同时让贝斯瞬间避让（侧链），低频不再挤在一起
  const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(55,t+.09);
  g.gain.setValueAtTime(.26*v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.14);o.connect(g);g.connect(dbus);o.start(t);o.stop(t+.18);
  bassBus.gain.setValueAtTime(.5,t);bassBus.gain.linearRampToValueAtTime(1,t+.14);
 }
 function nz(t,type,freq,vol,dur){
  const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=noise;f.type=type;f.frequency.value=freq;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(dbus);s.start(t);s.stop(t+dur+.02);
 }
 function sched(){
  while(next<LIMIT){
   const bar=Math.floor(step/8)%8,s=step%8,t=next;
   if(t<ac.currentTime-.03){step++;next+=E;continue}          // 主线程卡顿导致迟到：跳过该音，保持节拍网格不移位
   if(s===0)bus.gain.setTargetAtTime(lvl[bar],t,.4);                     // 每小节的音量起伏
   const m=mel[bar][s];if(m&&m[0])tone(sq,N(m[0]),t,E*m[1]*.95,.068);    // 主旋律：短长结合，句末留白
   const bo=bassOff[s];if(bo!=null)bass(N(roots[bar]+bo),t,E*(s?1.2:2.4),.34);
   if(s===3||s===7)tone(sq2,N(tri[bar][s===3?1:2]),t,E*1.6,.035);       // 和声点缀
   if(s===0)kick(t,1);else if(s===4)kick(t,.6);                                           // 每小节第 1、3 拍底鼓始终保留
   if(bar%4!==3&&(s===2||s===6))nz(t,'bandpass',2400,.035,.07);          // 军鼓（第 2、4 拍），呼吸段撤掉
   if(s===3||s===7)nz(t,'highpass',8000,bar%4!==3?.016:.011,.035);              // 踩镲保持稳定的八分音符脉冲
   step++;next+=E;
  }
 }

 async function renderLoop(){ // 渲染 2.25 遍；播放时在 [1.05L, 2.05L] 内循环。内容周期为 L，
  // 所以 MP3 编码延迟（开头多出的几十毫秒）不会造成断点：任意起点截取长度为 L 的片段都能无缝衔接
  unlock();const L=64*E;LIMIT=2.25*L;next=0;step=0;sched();
  const r=await ac.startRendering(),d=r.getChannelData(0),n=Math.round(2.25*L*SR),seg=d.slice(0,n);
  let pk=0,ss=0;const i16=new Int16Array(n);
  for(let i=0;i<n;i++){const v=seg[i];pk=Math.max(pk,Math.abs(v));ss+=v*v;i16[i]=Math.max(-32768,Math.min(32767,Math.round(v*32767)))}
  let bin='';const u=new Uint8Array(i16.buffer);for(let i=0;i<u.length;i+=8192)bin+=String.fromCharCode.apply(null,u.subarray(i,i+8192));
  return{b64:btoa(bin),peak:pk,rms:Math.sqrt(ss/n),n,seconds:L,loopStart:1.05*L,loopEnd:2.05*L};
 }
 return{renderLoop};
})();
</script>
